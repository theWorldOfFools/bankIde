services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankide}
      POSTGRES_USER: ${POSTGRES_USER:-bankide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "55432:5432"
    volumes:
      - bankide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    image: bankide:local
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankide}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bankide}
      BANKIDE_PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm --workspace server run db:init && npm --workspace server run seed:admin"]

  app:
    image: bankide:local
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankide}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bankide}
      PUBLIC_APP_URL: ${BANKIDE_PUBLIC_APP_URL:-http://localhost:4100}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BANKIDE_PORT: 4000
    ports:
      - "${BANKIDE_HOST_PORT:-4100}:4000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  bankide_pgdata:
